# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.bosh.sd.warehseaccele
type: application
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      mountPath: /ai-service
      afterMiddleware: compression
      configuration:
        baseUri: "http://localhost:8000"
        removeMountPath: true
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://d1m-https-sso:20
            client: '011'
            destination: d1m-sso
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
